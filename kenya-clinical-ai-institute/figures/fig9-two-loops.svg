<text x="660.0" y="896.0" font-family="Helvetica, Arial, sans-serif" font-size="14.25" fill="#12262B" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0" fill-opacity="1.0">A clinician recognises the shape immediately. You take consent once and you audit once; you ask and judge, ask and judge, many times in between.</text>
<text x="660.0" y="914.0" font-family="Helvetica, Arial, sans-serif" font-size="13.25" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0" fill-opacity="1.0">The failure the curriculum is built to prevent is running the inner loop without ever having closed the outer one.</text>
