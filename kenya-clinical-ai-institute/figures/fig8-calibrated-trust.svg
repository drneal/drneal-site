<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66787E"/>
    </marker>
    <marker id="arrowteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B4F4A"/>
    </marker>
  </defs>
<rect x="0" y="0" width="980" height="560" fill="#FFFFFF"/>
<text x="490" y="32" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#66787E" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="1.4">FIGURE 8 — CALIBRATED TRUST: THE CENTRAL PEDAGOGICAL TARGET</text>
<text x="490" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="italic" letter-spacing="0">Training that raises confidence without raising scepticism makes clinicians more dangerous, not less.</text>
<line x1="130" y1="440" x2="830" y2="440" stroke="#66787E" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="130" y1="440" x2="130" y2="110" stroke="#66787E" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="480.0" y="482" font-family="Helvetica, Arial, sans-serif" font-size="10.6" fill="#12262B" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="0.8">TRUST PLACED IN THE AI  →</text>
<text x="28" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="10.6" fill="#12262B" text-anchor="middle" font-weight="bold" letter-spacing="0.8" transform="rotate(-90 28 275.0)">PATIENT SAFETY  →</text>
<path d="M 150 400 Q 360 110 530 140 Q 690 166 810 416" fill="none" stroke="#0B4F4A" stroke-width="3" stroke-linejoin="round"/>
<rect x="150" y="104" width="190" height="336" rx="4" fill="#A63A2B" fill-opacity="0.07" stroke="#A63A2B" stroke-width="0"/>
<text x="245.0" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.4" fill="#A63A2B" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="1">UNDER-TRUST</text>
<text x="245.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Refuses a tool that would have helped.</text>
<text x="245.0" y="159.5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Misses the retinopathy the screening</text>
<text x="245.0" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">model flagged. Slower, not safer.</text>
<rect x="360" y="104" width="240" height="336" rx="4" fill="#0B4F4A" fill-opacity="0.07" stroke="#0B4F4A" stroke-width="0"/>
<text x="480.0" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11.4" fill="#0B4F4A" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="1">CALIBRATED TRUST</text>
<text x="480.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#12262B" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Consults deliberately, forms an</text>
<text x="480.0" y="323.5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#12262B" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">independent impression first,</text>
<text x="480.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#12262B" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">verifies, documents, owns it.</text>
<text x="480.0" y="350.5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#12262B" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="0">THIS IS WHAT WE TEACH.</text>
<rect x="620" y="104" width="200" height="336" rx="4" fill="#A63A2B" fill-opacity="0.07" stroke="#A63A2B" stroke-width="0"/>
<text x="720.0" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.4" fill="#A63A2B" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="1">OVER-TRUST</text>
<text x="720.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Accepts a confident, fluent,</text>
<text x="720.0" y="159.5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">wrong answer. Automation bias.</text>
<text x="720.0" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#66787E" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Skill decay. Harm.</text>
<circle cx="530" cy="140" r="7" fill="#FFFFFF" stroke="#0B4F4A" stroke-width="3"/>
<rect x="130" y="486" width="700" height="56" rx="6" fill="#F7EAE7" fill-opacity="1" stroke="#A63A2B" stroke-width="1.3"/>
<text x="146" y="506" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#A63A2B" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="0">The evidence we are designing against:</text>
<text x="146" y="522" font-family="Helvetica, Arial, sans-serif" font-size="9.2" fill="#12262B" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">A 2025 randomised trial found that physicians who had already completed 20 hours of AI-literacy training still deferred to</text>
<text x="146" y="535" font-family="Helvetica, Arial, sans-serif" font-size="9.2" fill="#12262B" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">deliberately erroneous LLM output. Literacy alone does not confer discernment. Discernment must be trained and tested directly.</text>
</svg>
